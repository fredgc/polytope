<h1 id="控制">控制</h1>
<p>顶部栏包含若干控制项：</p>
<ol type="1">
<li><p><strong>多胞体类型</strong>：选择要显示的正则多胞体。</p></li>
<li><p><strong>维度</strong>：选择维度（2到5）。</p></li>
<li><p><strong>截面切换</strong>：开启或关闭超平面截面交集。</p></li>
<li><p><strong>变换菜单</strong>：选择旋转模式（R3、R4、R5）、滑动变焦（Zolly）或平移。</p></li>
</ol>
<h2 id="手势与速度">手势与速度</h2>
<ul>
<li><p><strong>拖拽</strong>：根据当前模式旋转或平移多胞体。</p></li>
<li><p><strong>滚动/捏合</strong>：缩放多胞体。</p></li>
<li><p><strong>轻扫</strong>：赋予惯性速度，使旋转或切片平滑持续。</p></li>
<li><p><strong>轻触</strong>：停止运动。</p></li>
</ul>
<h2 id="快速对齐">快速对齐</h2>
<p>快速对齐多胞体，使顶点、棱、面或三维胞直接正对屏幕。</p>
